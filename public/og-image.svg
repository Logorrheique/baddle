<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1c1917"/>

  <!-- Subtle warm gradient overlay -->
  <defs>
    <radialGradient id="warm" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#3a3431" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- Decorative Wordle-style grid (left side) -->
  <g transform="translate(60, 90)">
    <!-- Row 1: B A D D L E in grey/yellow/green -->
    <g>
      <rect x="0"   y="0" width="75" height="75" rx="6" fill="#78716c"/>
      <rect x="85"  y="0" width="75" height="75" rx="6" fill="#f97316"/>
      <rect x="170" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="255" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="340" y="0" width="75" height="75" rx="6" fill="#f97316"/>
      <rect x="425" y="0" width="75" height="75" rx="6" fill="#78716c"/>
    </g>
    <text x="37.5"  y="56" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#fafaf9">B</text>
    <text x="122.5" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#fafaf9">A</text>
    <text x="207.5" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#fafaf9">D</text>
    <text x="292.5" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#fafaf9">D</text>
    <text x="377.5" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#fafaf9">L</text>
    <text x="462.5" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#fafaf9">E</text>

    <!-- Row 2: random pattern -->
    <g transform="translate(0, 90)">
      <rect x="0"   y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="85"  y="0" width="75" height="75" rx="6" fill="#78716c"/>
      <rect x="170" y="0" width="75" height="75" rx="6" fill="#f97316"/>
      <rect x="255" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="340" y="0" width="75" height="75" rx="6" fill="#78716c"/>
      <rect x="425" y="0" width="75" height="75" rx="6" fill="#f97316"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 180)">
      <rect x="0"   y="0" width="75" height="75" rx="6" fill="#f97316"/>
      <rect x="85"  y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="170" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="255" y="0" width="75" height="75" rx="6" fill="#78716c"/>
      <rect x="340" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="425" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
    </g>

    <!-- Row 4: all green = WIN -->
    <g transform="translate(0, 270)">
      <rect x="0"   y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="85"  y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="170" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="255" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="340" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
      <rect x="425" y="0" width="75" height="75" rx="6" fill="#6aaa64"/>
    </g>
  </g>

  <!-- Right side: text + shuttlecock -->
  <g transform="translate(620, 200)">
    <!-- Shuttlecock emoji -->
    <text x="0" y="0" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif" font-size="72">🏸</text>

    <!-- Title -->
    <text x="100" y="-10" font-family="Inter, sans-serif" font-weight="900" font-size="96" fill="#fafaf9" letter-spacing="6">BADDLE</text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="32" fill="#a8a29e">Le Wordle du badminton</text>

    <!-- Stats row -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#fafaf9">130 joueurs</text>
      <text x="160" y="0" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#f97316">·</text>
      <text x="190" y="0" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#fafaf9">2 modes</text>
      <text x="320" y="0" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#f97316">·</text>
      <text x="350" y="0" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#fafaf9">Daily</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="210" font-family="Inter, sans-serif" font-weight="400" font-size="20" fill="#78716c">baddle.app</text>
  </g>
</svg>
